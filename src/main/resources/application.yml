llm:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    default-model: ${OPENAI_MODEL:gpt-4.1-mini}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    default-model: ${OPENROUTER_MODEL:gryphe/mythomax-l2-13b}
    plugins:
      - id: context-compression
        enabled: false

  connect-timeout: ${LLM_CONNECT_TIMEOUT:10s}
  request-timeout: ${LLM_REQUEST_TIMEOUT:60s}
  system-prompt: |-
    Ты полезный AI-ассистент.
    Отвечай понятно, точно и по существу.
    Учитывай предыдущие сообщения пользователя в текущем диалоге.

task:
  state:
    analyzer:
      enabled: ${TASK_STATE_ANALYZER_ENABLED:true}
      provider: ${TASK_STATE_ANALYZER_PROVIDER:OPENAI}
      model: ${TASK_STATE_ANALYZER_MODEL:gpt-4o-mini}
      system-prompt: |-
        Analyze the active Task State and the new user message before the main assistant response.
        Return a structured proposal only.
        Explicit approval of a plan must propose PLAN_APPROVED while PLANNING.
        Concrete work requests may update currentStep and expectedAction without changing stage.
        Never invent completion and never propose an event invalid for the current stage.

context:
  strategies:
    sliding-window:
      size: ${CONTEXT_SLIDING_WINDOW_SIZE:20}
    sticky-facts:
      window-size: ${CONTEXT_STICKY_FACTS_WINDOW_SIZE:20}
      extractor:
        provider: ${CONTEXT_FACTS_PROVIDER:OPENAI}
        model: ${CONTEXT_FACTS_MODEL:gpt-4o-mini}
        system-prompt: |-
          Проанализируй новое сообщение пользователя.
          Выделяй только долгоживущие факты: цели, ограничения,
          предпочтения, решения, договорённости и важные параметры.
          Учитывай существующие facts и не добавляй информацию,
          которой пользователь не сообщал.
          Верни JSON с массивом upsert и массивом ключей delete.
  compression:
    enabled: ${CONTEXT_COMPRESSION_ENABLED:true}
    summarize-after-messages: ${CONTEXT_SUMMARIZE_AFTER_MESSAGES:4}
    summarize-every-messages: ${CONTEXT_SUMMARIZE_EVERY_MESSAGES:2}
    provider: ${CONTEXT_SUMMARY_PROVIDER:OPENAI}
    model: ${CONTEXT_SUMMARY_MODEL:gpt-4o-mini}
    system-prompt: |-
      Сожми предыдущий диалог в компактное самостоятельное summary.
      Сохрани важные факты, решения, предпочтения пользователя,
      технический контекст, ограничения и открытые вопросы.
      Не добавляй информацию, которой не было в диалоге.
      Целевой размер summary — не более 320 токенов.
      Если вся информация не помещается, приоритет
      1. текущие требования и ограничения;
      2. точные факты и значения, которые могут понадобиться позже;
      3. принятые решения;
      4. текущее состояние задачи;
      5. открытые вопросы;
      6. остальной контекст.

memory:
  enabled: ${MEMORY_ENABLED:true}
  extractor:
    provider: ${MEMORY_EXTRACTOR_PROVIDER:OPENAI}
    model: ${MEMORY_EXTRACTOR_MODEL:gpt-4o-mini}
    system-prompt: |-
      Проанализируй новое сообщение пользователя.
      В WORKING сохраняй только цели, ограничения, параметры,
      решения, технологии и договорённости текущей Task.
      В LONG_TERM сохраняй только устойчивые предпочтения,
      профиль и знания, полезные между разными Tasks.
      Не сохраняй приветствия, случайные фразы, секреты
      или временные детали. Не придумывай информацию.
      Обновляй существующий key при изменении значения.
      Удаляй key только при явной отмене пользователем.
      Верни только JSON с working и longTerm,
      каждый с массивами upsert и delete.

storage:
  database-path: ${AGENT_DB_PATH:./data/agent.db}

spring:
  application:
    name: ai-agent
